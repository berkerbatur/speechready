[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechready"
version = "0.0.1"
description = "Prepare text for text-to-speech: clean LLM output, verbalize ambiguous tokens, compile pauses to each provider's syntax, chunk under model limits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Berker Batur" }]
keywords = ["tts", "text-to-speech", "text-normalization", "ssml", "voice-agents"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/berkerbatur/speechready"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
