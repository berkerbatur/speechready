[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechready"
version = "0.1.0.dev0"
description = "Prepare text for text-to-speech: clean LLM output, verbalize ambiguous tokens, compile pauses to each provider's syntax, chunk under model limits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
authors = [{ name = "Berker Batur" }]
keywords = ["tts", "text-to-speech", "text-normalization", "ssml", "voice-agents"]
classifiers = [
  "Development Status :: 1 - Planning",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/berkerbatur/speechready"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/speechready"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
