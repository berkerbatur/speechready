id: elevenlabs-v2
provider: elevenlabs
models: [eleven_multilingual_v2, eleven_flash_v2_5, eleven_flash_v2, eleven_turbo_v2_5, eleven_turbo_v2, eleven_multilingual_v1, eleven_monolingual_v1]
default: true
syntax: plain
escape: none
audio_tags: false
limit:
  unit: chars
  max: 10000
  per_model:
    eleven_flash_v2_5: 40000
    eleven_flash_v2: 30000
intents:
  pause: {render: '<break time="{s}s" />', min_ms: 100, max_ms: 3000}
  spell: {render: spaced}
  emphasis: {render: "{text}"}
lexicon: {format: pls, alphabet: ipa}
notes: >
  Models before v3 accept the SSML break tag and nothing else from SSML. Pauses
  are capped at 3 seconds; the docs warn that many breaks in one request can
  destabilise output, so keep them few. Dashes and ellipses are the documented
  fallback. Character limits per model come from the models overview page;
  turbo models list none there, so they inherit the 10,000 default.
sources:
  - https://elevenlabs.io/docs/product/prompting/pauses
  - https://elevenlabs.io/docs/overview/models
verified: "2026-10-27"
