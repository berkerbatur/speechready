# Foreign tech acronyms and names as Turkish developers say them, with English letter
# names (API -> ey pi ay) and English-sounding respellings (JSON -> ceyson). The source
# of truth for the lexicon bundled in both packages:
#
#     prepare(text, locale="tr-TR", lexicon="tr-tech")           # Python
#     prepare(text, { locale: "tr-TR", lexicon: "tr-tech" })     # JavaScript
#
# The Turkish verbalizer already reads lowercase consonant-only acronyms (npm, css)
# with English letter names; this file covers the uppercase and vowel-bearing ones
# the rule cannot decide on its own, and a few product names. Everyday acronyms that
# Turkish speakers say with Turkish letter names (TV, ATM, SMS, USB) are left out on
# purpose. An apostrophe suffix is refitted to the spoken form (API'yi -> ey pi ay'ı).
locale: tr-TR
entries:
  - {word: API, say: "ey pi ay"}
  - {word: URL, say: "yu ar el"}
  - {word: URI, say: "yu ar ay"}
  - {word: AWS, say: "ey dabılyu es"}
  - {word: GCP, say: "ci si pi"}
  - {word: CPU, say: "si pi yu"}
  - {word: GPU, say: "ci pi yu"}
  - {word: SSD, say: "es es di"}
  - {word: HTML, say: "eyç ti em el"}
  - {word: CSS, say: "si es es"}
  - {word: SQL, say: "es kyu el"}
  - {word: PHP, say: "pi eyç pi"}
  - {word: HTTP, say: "eyç ti ti pi"}
  - {word: HTTPS, say: "eyç ti ti pi es"}
  - {word: JS, say: "cey es"}
