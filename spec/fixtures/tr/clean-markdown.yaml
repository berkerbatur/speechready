rule: clean.markdown
locale: tr-TR
cases:
  - id: bold-and-inline-code
    input: "**Adım 1:** `npm install` çalıştırın"
    expect: "Adım 1: npm install çalıştırın."
  - id: heading-gets-a-stop
    input: "## Fiyatlar\nİki plan var."
    expect: "Fiyatlar.\nİki plan var."
  - id: bullet-list
    input: "- elma\n- armut"
    expect: "elma.\narmut."
  - id: lone-ordinal-is-not-a-list
    input: "3. madde önemli."
    expect: "3. madde önemli."
  - id: numbered-list-not-starting-at-one
    input: "3. elma\n4. armut"
    expect: "3. elma.\n4. armut."
