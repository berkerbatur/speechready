rule: chunk.stream
locale: en-US
cases:
  - id: sentences-released-as-confirmed
    stream: ["Hello th", "ere. How ", "are you? Fi", "ne."]
    expect: ["Hello there.", "How are you?", "Fine."]
  - id: abbreviation-split-across-tokens
    stream: ["Dr", ". Smith", " is here. Ok", "."]
    expect: ["Dr. Smith is here.", "Ok."]
  - id: decimal-split-across-tokens
    stream: ["Pi is 3", ".14 today. Yes", "."]
    expect: ["Pi is 3.14 today.", "Yes."]
  - id: newline-releases-immediately
    stream: ["First\nSecond"]
    expect: ["First", "Second"]
  - id: max-buffer-releases-at-clause
    stream: ["one, two, three, four, five, six, seven"]
    max_buffer: 20
    expect: ["one, two, three,", "four, five, six, seven"]
  - id: fenced-block-released-whole
    stream: ["Run this:\n```bash\nnpm i x. Then\n", "echo hi\n```\nThen restart."]
    expect: ["Run this:", "```bash\nnpm i x. Then\necho hi\n```", "Then restart."]
  - id: fence-opening-split-across-tokens
    stream: ["See:\n``", "`\nprint(1.5)\n`", "``\nDone. Bye."]
    expect: ["See:", "```\nprint(1.5)\n```", "Done.", "Bye."]
  - id: unclosed-fence-flushed-whole
    stream: ["```\nfoo. bar\nbaz"]
    expect: ["```\nfoo. bar\nbaz"]
