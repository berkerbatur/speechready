rule: lexicon.export
locale: en-US
cases:
  - id: pls
    format: pls
    lexicon:
      - {word: Nginx, ipa: "ˈɛndʒɪnˈɛks", say: "engine X"}
      - {word: SQL, say: sequel}
      - {word: CLI, spell: true}
      - {word: "R&D", say: "R and D"}
    expect: |
      <?xml version="1.0" encoding="UTF-8"?>
      <lexicon version="1.0" xmlns="http://www.w3.org/2005/01/pronunciation-lexicon" alphabet="ipa" xml:lang="en-US">
        <lexeme>
          <grapheme>Nginx</grapheme>
          <phoneme>ˈɛndʒɪnˈɛks</phoneme>
        </lexeme>
        <lexeme>
          <grapheme>SQL</grapheme>
          <alias>sequel</alias>
        </lexeme>
        <lexeme>
          <grapheme>CLI</grapheme>
          <alias>C L I</alias>
        </lexeme>
        <lexeme>
          <grapheme>R&amp;D</grapheme>
          <alias>R and D</alias>
        </lexeme>
      </lexicon>
  - id: google
    format: google
    lexicon:
      - {word: Nginx, ipa: "ˈɛndʒɪnˈɛks", say: "engine X"}
      - {word: SQL, say: sequel}
    expect: |
      {
        "pronunciations": [
          {
            "phrase": "Nginx",
            "phoneticEncoding": "PHONETIC_ENCODING_IPA",
            "pronunciation": "ˈɛndʒɪnˈɛks"
          }
        ]
      }
  - id: json-roundtrip
    format: json
    lexicon:
      - {word: Nginx, ipa: "ˈɛndʒɪnˈɛks", say: "engine X"}
      - {word: GIF, say: jif, case_sensitive: true}
    expect: |
      {
        "locale": "en-US",
        "entries": [
          {
            "word": "Nginx",
            "ipa": "ˈɛndʒɪnˈɛks",
            "say": "engine X"
          },
          {
            "word": "GIF",
            "say": "jif",
            "case_sensitive": true
          }
        ]
      }
