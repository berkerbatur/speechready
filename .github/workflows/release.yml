name: Release

# Publishes to PyPI and npm when a version bump lands on main. A release PR bumps
# `__version__` (python) and package.json `version` (js) to the same number and dates
# the CHANGELOG entry; merging it is the release. Nothing else is run by hand.
#
# Both registries use trusted publishing: they accept this workflow's OIDC token, so
# the repository holds no registry credentials.
#
# One-time setup on each registry (project settings, done once by the owner):
#   PyPI  -> project speechready -> Publishing -> add GitHub publisher:
#            owner berkerbatur, repository speechready, workflow release.yml, environment pypi
#   npm   -> package speechready -> Settings -> Trusted publishing -> GitHub Actions:
#            organization/user berkerbatur, repository speechready, workflow release.yml, environment npm
#
# A push to main that leaves the version alone, or whose version is already tagged, is
# skipped. Mismatched versions, or a version without a dated CHANGELOG entry, fail the
# run so the mistake is seen. The tag and the GitHub release are created last, after
# both registries have accepted the packages, so a failed publish leaves nothing to
# clean up: fix the cause and re-run the failed jobs, or run the workflow by hand.

on:
  push:
    branches: [main]
    paths:
      - python/src/speechready/__init__.py
      - js/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency: release

jobs:
  decide:
    name: version bumped, changelog dated, not yet tagged
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Compare the package versions, the changelog and the existing tags
        run: |
          py=$(python3 -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('python/src/speechready/__init__.py').read_text()).group(1))")
          js=$(node -p "require('./js/package.json').version")
          echo "python=$py js=$js"
          if [ "$py" != "$js" ]; then
            echo "::error::package versions differ (python $py, js $js); bump both to the same number"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$py" >/dev/null; then
            echo "::notice::v$py is already tagged; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "^## $(printf '%s' "$py" | sed 's/\./\\./g') \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated entry '## $py (YYYY-MM-DD)'"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=$py" >> "$GITHUB_OUTPUT"

  check:
    name: tests pass
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: python -m pip install -e "python[dev]" -e eval
      - run: pytest python eval
      - run: npm ci && npm test
        working-directory: js

  pypi:
    name: publish to PyPI
    needs: [decide, check]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/speechready/${{ needs.decide.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build --outdir dist python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  npm:
    name: publish to npm
    needs: [decide, check]
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/speechready/v/${{ needs.decide.outputs.version }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"   # ships npm 11.5+, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
        working-directory: js
      - run: npm publish --access public
        working-directory: js

  release:
    name: tag and GitHub release
    needs: [decide, pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create tag v${{ needs.decide.outputs.version }} on this commit, with the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { on = ($2 == v) ; next }
            on { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md --generate-notes
