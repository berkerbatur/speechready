name: Pages

# Publishes docs/ (the listening page and the playground) to GitHub Pages.
# The playground runs the Python package in the browser, so the job builds the
# wheel from python/ and ships it next to the page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          python -m pip wheel ./python --no-deps -w _site/play
          basename _site/play/*.whl > _site/play/wheel.txt
          git rev-parse --short HEAD > _site/play/commit.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
