name: Pages

# Publishes docs/ (the listening page and the playground) to GitHub Pages.
# The playground runs the JavaScript package in the browser, so the job builds
# js/ and ships its dist/ next to the page as play/lib/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci && npm run build
        working-directory: js
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          cp -R js/dist _site/play/lib
          find _site/play/lib -name '*.d.ts' -delete
          git rev-parse --short HEAD > _site/play/commit.txt
      - uses: actions/configure-pages@v5
        with:
          enablement: true  # creates the Pages site on the first run if the repository has none yet
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
