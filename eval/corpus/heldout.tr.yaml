  question: Nöbetçi eczaneyi nasıl bulurum, eczaneler pazar günü kaçta kapanır?
  input: Nöbetçi eczaneyi, eczane nöbetçi bilgisi sunan mobil uygulamalar veya Sağlık Bakanlığı'nın web sitesi üzerinden öğrenebilirsiniz. Pazar günleri eczaneler genellikle saat 12:00 veya 13:00 civarında kapanır, ancak nöbetçi eczaneler 24 saat hizmet verir. Bölgenize göre değişiklik gösterebileceği için güncel bilgiyi kontrol etmeniz faydalı olur.
  intended: Nöbetçi eczaneyi, eczane nöbetçi bilgisi sunan mobil uygulamalar veya Sağlık Bakanlığı'nın web sitesi üzerinden öğrenebilirsiniz. Pazar günleri eczaneler genellikle saat on iki veya on üç civarında kapanır, ancak nöbetçi eczaneler yirmi dört saat hizmet verir. Bölgenize göre değişiklik gösterebileceği için güncel bilgiyi kontrol etmeniz faydalı olur.
