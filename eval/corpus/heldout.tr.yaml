  question: Bir günde İstanbul'da görülecek yerleri iki cümleyle özetle.
  input: İstanbul'da bir gün içinde Sultanahmet Camii, Ayasofya ve Topkapı Sarayı gibi tarihi mekanları gezebilir, ardından Boğaz turu yaparak şehrin eşsiz manzarasının tadını çıkarabilirsiniz. Ayrıca Kapalıçarşı'da alışveriş yaparak kültürel deneyiminizi tamamlayabilirsiniz.
