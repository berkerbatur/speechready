  question: Kıst ücret nedir, kısa bir örnekle açıklar mısın?
  input: Kıst ücret, çalışanın bir ayın tamamında değil, ayın belirli bir kısmında çalışması durumunda o süreye denk gelen maaşının hesaplanmasıdır. Örneğin, aylık 3000 TL alan biri ayın 10 günü çalıştıysa, kıst ücreti 3000 ÷ 30 × 10 = 1000 TL olur. Böylece sadece çalışılan gün kadar ücret ödenir.
  intended: Kıst ücret çalışanın bir ayın tamamında değil ayın belirli bir kısmında çalışması durumunda o süreye denk gelen maaşının hesaplanmasıdır. Örneğin aylık üç bin Türk lirası alan biri ayın on günü çalıştıysa kıst ücreti üç bin bölü otuz çarpı on eşittir bin Türk lirası olur. Böylece sadece çalışılan gün kadar ücret ödenir.
