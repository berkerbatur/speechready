  question: Ankara'da kasım ayında hava genelde nasıl olur?
  input: Ankara'da Kasım ayında hava genellikle serin ve yağışlıdır. Ortalama sıcaklık 5-12°C arasında değişir. Akşamları ise hava daha soğuk olabilir, mont veya kalın giyinmek faydalı olur.
  intended: Ankara'da Kasım ayında hava genellikle serin ve yağışlıdır. Ortalama sıcaklık beş ile on iki derece arasında değişir. Akşamları ise hava daha soğuk olabilir, mont veya kalın giyinmek faydalı olur.
