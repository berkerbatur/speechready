  question: My flight is delayed 3 hours. What am I entitled to under EU rules?
  input: Under EU Regulation 261/2004, if your flight is delayed by 3 hours or more and the flight is within the EU or operated by an EU airline, you may be entitled to compensation ranging from €250 to €600, depending on the flight distance. Additionally, the airline must provide you with assistance such as meals, refreshments, and communication (e.g., phone calls or emails) during the delay. If the delay extends overnight, they should also offer accommodation. Compensation may not apply if the delay was caused by extraordinary circumstances beyond the airline's control.
  intended: Under EU Regulation two six one slash two thousand four, if your flight is delayed by three hours or more and the flight is within the EU or operated by an EU airline, you may be entitled to compensation ranging from two hundred fifty euros to six hundred euros, depending on the flight distance. Additionally, the airline must provide you with assistance such as meals, refreshments, and communication, for example, phone calls or emails, during the delay. If the delay extends overnight, they should also offer accommodation. Compensation may not apply if the delay was caused by extraordinary circumstances beyond the airline's control.
