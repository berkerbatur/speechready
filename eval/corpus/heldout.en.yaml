  question: What should I know about tipping in Turkey as a tourist?
  input: In Turkey, tipping (known as "bahşiş") is appreciated but not always mandatory. In restaurants, it’s customary to leave around 5-10% of the bill if service is not included. For cafes or smaller eateries, rounding up the bill or leaving small change is common. Tipping hotel staff, taxi drivers, and tour guides is also welcomed but usually modest. Overall, tips are seen as a gesture of gratitude for good service.
