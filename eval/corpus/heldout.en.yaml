- id: education-2
  cls: heldout/education
  question: What's the Pythagorean theorem and give me one worked example.
  input: 'The Pythagorean theorem states that in a right-angled triangle, the square of the length of the hypotenuse (the side opposite the right angle) is equal to the sum of the squares of the lengths of the other two sides. Mathematically, it’s \(a^2 + b^2 = c^2\).


    Example: If one side is 3 units and the other side is 4 units, the hypotenuse is found by:

    \(3^2 + 4^2 = c^2\)

    \(9 + 16 = c^2\)

    \(25 = c^2\)

    So, \(c = 5\) units.'
  intended: 'The Pythagorean theorem states that in a right-angled triangle, the square of the length of the hypotenuse, the side opposite the right angle, is equal to the sum of the squares of the lengths of the other two sides. Mathematically, it’s a squared plus b squared equals c squared.


    Example: If one side is three units and the other side is four units, the hypotenuse is found by: three squared plus four squared equals c squared, nine plus sixteen equals c squared, twenty-five equals c squared. So, c equals five units.'
