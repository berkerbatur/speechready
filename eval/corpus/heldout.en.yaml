  question: What's the simplest way to schedule a backup script to run every night at 2am on Linux?
  input: 'The simplest way is to use cron. Run `crontab -e` and add this line to schedule your backup script at 2 AM daily:


    ```

    0 2 * * * /path/to/your/backup_script.sh

    ```


