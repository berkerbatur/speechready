  question: How do I convert 72 degrees Fahrenheit to Celsius, step by step?
  input: 'To convert 72°F to Celsius, follow these steps:


    1. Subtract 32 from the Fahrenheit temperature: 72 - 32 = 40.

    2. Multiply the result by 5/9: 40 × (5/9) = 22.22.


    So, 72°F is approximately 22.22°C.'
  intended: 'To convert seventy-two degrees Fahrenheit to Celsius, follow these steps:


    One. Subtract thirty-two from the Fahrenheit temperature: seventy-two minus thirty-two equals forty.


    Two. Multiply the result by five ninths: forty times five ninths equals twenty-two point two two.


    So, seventy-two degrees Fahrenheit is approximately twenty-two point two two degrees Celsius.'
