  question: What's the difference between APR and APY on a savings account?
  input: APR (Annual Percentage Rate) represents the yearly interest rate without compounding, showing the simple interest earned. APY (Annual Percentage Yield) includes the effect of compounding interest, reflecting the actual annual return on your savings. In short, APY gives a more accurate picture of how much you'll earn in a year because it accounts for interest-on-interest growth.
